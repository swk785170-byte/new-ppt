<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Skyline — The Rescue Glider Challenge</title>
<!--
  ==========================================================================
   OPERATION SKYLINE // The Rescue Glider Challenge
   Interactive "hero" deck — self-contained, offline-ready, dependency-free.
   Shares the holographic visual system with the .pptx (palette mirrored in
   :root below). All motion is real CSS keyframes + animated inline SVG:
     • persistent scanline / flicker / vignette ambiance
     • BUILD  — glider airframe assembles (SVG line-drawing + parts lock in)
     • LAUNCH — throwing arm sweeps, glider releases up the arc
     • IMPACT — flight arc draws to the rescue zone, target rings light,
                amber shock-ripple on contact
   Nav: click right/left half · arrow keys / space · on-screen buttons · dots.
  ==========================================================================
-->
<style>
  /* ---- palette (mirrors scripts/theme.mjs C) --------------------------- */
  :root{
    --bg0:#04060E; --bg1:#081120; --bg2:#0E1B30; --grid:#13314C;
    --holo:#34E7E7; --holoLt:#7DF7F2; --holoHot:#D8FFFB; --electron:#3E86FF;
    --amber:#FFB020; --amberLt:#FFD873; --danger:#FF5A5A;
    --text:#EAF7FF; --textDim:#9BBFD3; --textFaint:#5E7C90;
    --mono:'Consolas','SF Mono','Roboto Mono',ui-monospace,monospace;
    --sans:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
    --holoGlow:0 0 6px rgba(52,231,231,.55),0 0 18px rgba(52,231,231,.28);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg0); color:var(--text); font-family:var(--sans);
    overflow:hidden; -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* ---- stage / slide track -------------------------------------------- */
  #stage{position:fixed; inset:0; overflow:hidden;}
  #track{display:flex; width:100%; height:100%;
    transition:transform .72s var(--ease);}
  .slide{position:relative; min-width:100%; height:100%; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
    padding:min(6.2vh,64px) min(6vw,90px);}
  /* schematic grid + vignette + void backdrop shared by every slide */
  .slide::before{content:""; position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(120% 90% at 78% 12%, rgba(62,134,255,.10), transparent 55%),
      radial-gradient(120% 120% at 15% 100%, rgba(52,231,231,.10), transparent 55%),
      linear-gradient(var(--bg1),var(--bg0));
  }
  .slide::after{content:""; position:absolute; inset:0; z-index:0; opacity:.5;
    background-image:
      linear-gradient(rgba(19,49,76,.55) 1px,transparent 1px),
      linear-gradient(90deg,rgba(19,49,76,.55) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(130% 100% at 50% 45%,#000 55%,transparent 100%);
            mask-image:radial-gradient(130% 100% at 50% 45%,#000 55%,transparent 100%);
  }
  .slide > *{position:relative; z-index:2;}

  /* ---- ambient overlay: scanlines + flicker + vignette ---------------- */
  #fx{position:fixed; inset:0; z-index:60; pointer-events:none;}
  #fx .scan{position:absolute; inset:0; opacity:.35;
    background:repeating-linear-gradient(to bottom,
      rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;}
  #fx .sweep{position:absolute; left:0; right:0; height:26%;
    background:linear-gradient(to bottom,transparent,rgba(52,231,231,.06),transparent);
    animation:sweep 7.5s linear infinite;}
  #fx .flick{position:absolute; inset:0; background:rgba(52,231,231,.02);
    animation:flick 5s steps(2,end) infinite;}
  #fx .vig{position:absolute; inset:0;
    box-shadow:inset 0 0 240px 40px rgba(0,0,0,.75);}
  @keyframes sweep{0%{transform:translateY(-30%)}100%{transform:translateY(430%)}}
  @keyframes flick{0%,100%{opacity:.35}48%{opacity:.55}50%{opacity:.15}52%{opacity:.5}}

  /* ---- typographic system --------------------------------------------- */
  .kicker{font-family:var(--mono); font-weight:700; letter-spacing:.32em;
    font-size:clamp(11px,1.15vw,14px); color:var(--holo);
    text-shadow:var(--holoGlow);}
  .kicker.danger{color:var(--danger); text-shadow:0 0 8px rgba(255,90,90,.5);}
  .seqmark{font-family:var(--mono); font-weight:700; letter-spacing:.4em;
    color:var(--holo); font-size:clamp(11px,1.15vw,14px); text-shadow:var(--holoGlow);}
  h1.title{font-family:var(--sans); font-weight:900; letter-spacing:.01em;
    line-height:1.02; color:var(--text); text-shadow:0 2px 30px rgba(0,0,0,.5);}
  .lead{color:var(--textDim); font-size:clamp(15px,1.5vw,19px);
    line-height:1.5; max-width:52ch;}
  .footer{position:absolute; left:min(6vw,90px); right:min(6vw,90px);
    bottom:min(3.4vh,30px); display:flex; justify-content:space-between;
    align-items:center; font-family:var(--mono); font-size:clamp(9px,.85vw,11px);
    letter-spacing:.18em; color:var(--textFaint); z-index:3;}
  .footer .idx b{color:var(--holo)} .footer .idx span{color:var(--textDim)}

  /* ---- reusable holo card --------------------------------------------- */
  .card{background:linear-gradient(160deg,rgba(14,27,48,.85),rgba(8,17,32,.6));
    border:1px solid var(--grid); border-radius:12px; position:relative;
    overflow:hidden; backdrop-filter:blur(2px);}
  .card::before{content:""; position:absolute; left:22px; top:26px; width:44px;
    height:4px; background:var(--holo); box-shadow:var(--holoGlow); border-radius:2px;}
  .card .num{font-family:var(--sans); font-weight:900; color:var(--holo);
    text-shadow:var(--holoGlow); font-size:clamp(34px,3.6vw,50px); line-height:1;}
  .card h3{font-family:var(--sans); font-weight:700; color:var(--text);
    font-size:clamp(15px,1.4vw,18px); margin:.1em 0 .4em;}
  .card p{color:var(--textDim); font-size:clamp(12px,1.05vw,13.5px); line-height:1.45;}

  /* =====================================================================
     PER-SLIDE LAYOUTS
     ===================================================================== */
  /* Cover / Closing centered */
  .center{align-items:center; text-align:center;}
  .center .title{font-size:clamp(44px,7.6vw,104px); letter-spacing:.03em;
    margin:.12em 0 .1em;}
  .center .sub{font-family:var(--sans); font-weight:700; color:var(--holoLt);
    text-shadow:var(--holoGlow); font-size:clamp(20px,2.7vw,34px);}
  .center .tag{color:var(--textDim); font-style:italic;
    font-size:clamp(14px,1.5vw,18px); margin-top:.7em;}
  .center .meta{font-family:var(--mono); letter-spacing:.12em; margin-top:1.5em;
    font-size:clamp(11px,1.2vw,14px); color:var(--textDim);}
  .center .meta b{color:var(--text)} .center .meta i{color:var(--holo);font-style:normal;}
  .corner{position:absolute; top:min(4vh,34px); font-family:var(--mono);
    font-size:clamp(9px,.9vw,11px); letter-spacing:.22em; color:var(--textFaint); z-index:3;}
  .corner.l{left:min(6vw,90px)} .corner.r{right:min(6vw,90px)}

  /* Mission briefing */
  .brief .title{font-size:clamp(34px,5.2vw,60px); margin:.28em 0 .5em;}
  .chip{display:inline-flex; align-items:center; gap:.5em; font-family:var(--mono);
    font-weight:700; font-size:clamp(10px,1vw,12px); letter-spacing:.16em;
    color:var(--danger); border:1px solid var(--danger); border-radius:7px;
    padding:.42em .8em; background:rgba(255,90,90,.06);}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);
    box-shadow:0 0 8px var(--danger); animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .narr{margin-top:1.4em; display:flex; flex-direction:column; gap:.85em; max-width:64ch;}
  .narr .ln{display:flex; gap:.9em; align-items:flex-start;}
  .narr .ln .bar{flex:none; width:5px; height:1.35em; background:var(--holo);
    box-shadow:var(--holoGlow); border-radius:2px; margin-top:.12em;}
  .narr .ln.first p{color:var(--holoLt); font-weight:700; font-size:clamp(17px,1.85vw,22px);}
  .narr .ln p{color:var(--textDim); font-size:clamp(14px,1.45vw,17px); line-height:1.4;}
  .punch{margin-top:1.5em; color:var(--text); font-weight:700;
    font-size:clamp(16px,1.75vw,21px); line-height:1.35; max-width:60ch;
    font-family:var(--sans);}

  /* generic header block (kicker + title + optional lead) */
  .head{margin-bottom:min(3vh,26px);}
  .head .title{font-size:clamp(30px,4.4vw,52px); margin:.24em 0;}

  /* objective cards row */
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:min(2vw,22px);}
  .grid4 .card{padding:26px 22px 24px; display:flex; flex-direction:column;}
  .grid4 .card .num{margin-top:14px;}

  /* rules columns */
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:min(2.4vw,30px);}
  .grid3 .col{padding:26px 24px;}
  .grid3 .col .cnum{font-family:var(--mono); font-weight:700; color:var(--holo);
    letter-spacing:.1em; text-shadow:var(--holoGlow); font-size:clamp(13px,1.3vw,16px);}
  .grid3 .col h3{font-family:var(--sans); font-weight:700; color:var(--holoLt);
    font-size:clamp(17px,1.7vw,21px); margin:.2em 0 .7em;}
  .grid3 .col ul{list-style:none; display:flex; flex-direction:column; gap:.62em;}
  .grid3 .col li{position:relative; padding-left:1.2em; color:var(--textDim);
    font-size:clamp(12.5px,1.2vw,15px); line-height:1.4;}
  .grid3 .col li::before{content:""; position:absolute; left:0; top:.5em; width:8px;
    height:8px; background:var(--holo); box-shadow:var(--holoGlow);}

  /* judging bars */
  .judge{display:flex; flex-direction:column; gap:min(2.2vh,20px); max-width:1100px;}
  .jrow{display:grid; grid-template-columns:max-content 1fr; column-gap:min(2.6vw,32px);
    align-items:center;}
  .jrow .pct{font-family:var(--sans); font-weight:900; color:var(--holo);
    text-shadow:var(--holoGlow); font-size:clamp(26px,3.2vw,40px); line-height:1;
    white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums;}
  .jrow .info{display:flex; flex-direction:column; gap:.35em; grid-column:2;}
  .jrow .info .rowtop{display:flex; justify-content:space-between; align-items:baseline; gap:1em;}
  .jrow .info h3{font-family:var(--sans); font-weight:700; color:var(--text);
    font-size:clamp(15px,1.6vw,20px);}
  .jrow .info p{color:var(--textFaint); font-size:clamp(11px,1.05vw,13.5px);}
  .bar{height:12px; border-radius:6px; background:var(--bg2);
    border:1px solid var(--grid); overflow:hidden; position:relative;}
  .bar i{display:block; height:100%; width:0; border-radius:6px;
    background:linear-gradient(90deg,var(--electron),var(--holo));
    box-shadow:0 0 12px rgba(52,231,231,.6); transition:width 1.1s var(--ease);}
  .slide.active .bar i{width:var(--w);}

  /* timeline */
  .tl{position:relative; margin-left:2px; display:flex; flex-direction:column;
    gap:min(1.9vh,17px);}
  .tl .spine{position:absolute; left:calc(1.5ch + 34px); top:6px; bottom:6px;
    width:2px; background:var(--grid);}
  .tl .spine i{position:absolute; inset:0 auto 0 0; width:100%; height:0;
    background:linear-gradient(var(--holo),var(--electron));
    box-shadow:0 0 10px rgba(52,231,231,.6); transition:height 1.3s var(--ease);}
  .slide.active .tl .spine i{height:100%;}
  .tl .stop{display:grid; grid-template-columns:5.5ch 34px 1fr; align-items:center;
    column-gap:14px;}
  .tl .stop .t{font-family:var(--mono); font-weight:700; color:var(--holo);
    text-shadow:var(--holoGlow); font-size:clamp(13px,1.4vw,17px);}
  .tl .stop .node{justify-self:center; width:15px; height:15px; border-radius:50%;
    background:var(--holo); box-shadow:var(--holoGlow); border:2px solid var(--bg0);
    position:relative; z-index:2;}
  .tl .stop .txt b{color:var(--text); font-weight:700; font-size:clamp(14px,1.4vw,17px);}
  .tl .stop .txt span{color:var(--textDim); font-size:clamp(12px,1.2vw,14.5px); margin-left:.6em;}

  /* hero (build/launch/impact) two-column */
  .hero{display:grid; grid-template-columns:1.05fr 1fr; align-items:center;
    gap:min(3vw,40px); height:100%;}
  .hero .htext{display:flex; flex-direction:column; gap:.7em;}
  .hero .htext .htitle{font-family:var(--sans); font-weight:900;
    font-size:clamp(52px,8.5vw,120px); line-height:.92; letter-spacing:.04em;
    color:var(--text); text-shadow:0 0 30px rgba(52,231,231,.25);}
  .hero .htext .hline{color:var(--textDim); font-style:italic; max-width:34ch;
    font-size:clamp(14px,1.5vw,18px); line-height:1.45;}
  .hero .htext .hnote{font-family:var(--mono); color:var(--textFaint);
    font-size:clamp(10px,1vw,12.5px); letter-spacing:.14em; margin-top:.4em;}
  .hero .stagebox{position:relative; width:100%; aspect-ratio:1/1;
    max-height:74vh; justify-self:center;}
  .hero svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}

  /* ---- SVG stroke helpers --------------------------------------------- */
  .draw{stroke-dasharray:var(--len,600); stroke-dashoffset:var(--len,600);}
  .slide.active .draw{animation:draw 1.15s var(--ease) forwards;}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{opacity:0}
  .slide.active .fadein{animation:fadein .8s ease forwards;}
  @keyframes fadein{to{opacity:1}}
  .popin{opacity:0; transform:scale(.6);}
  .slide.active .popin{animation:popin .5s var(--ease) forwards;}
  @keyframes popin{to{opacity:1; transform:scale(1);}}

  /* generic staggered entrance for text blocks */
  .rise{opacity:0; transform:translateY(16px);}
  .slide.active .rise{animation:rise .7s var(--ease) forwards;}
  @keyframes rise{to{opacity:1; transform:none;}}

  /* ---- hero glider flight (build / launch / impact) ------------------- */
  /* The glider sits in an outer <g transform="translate(endX,endY)"> and the
     inner .glide* animates the flight-in offset + bank, pivoting on its own
     centre (transform-box:fill-box) so the plane reads as flying along the arc. */
  .glideL,.glideI,.buildGlider{opacity:0; transform-box:fill-box; transform-origin:center;}
  /* cyan glow for the holo glider */
  .glideL,.buildGlider{filter:drop-shadow(0 0 5px rgba(52,231,231,.55));}
  /* IMPACT: keep the cyan sprite (complementary to the amber target, so it
     reads with high contrast) and brighten it for the strike flash */
  .glideI{filter:brightness(1.25) drop-shadow(0 0 9px rgba(125,247,242,.85));}

  /* BUILD — airframe materialises in the hands */
  .slide.active .buildGlider{animation:buildGlider 1.05s var(--ease) .55s forwards;}
  @keyframes buildGlider{
    0%  {opacity:0; transform:scale(.45) rotate(-5deg);}
    55% {opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(0);}
  }
  /* LAUNCH — glider climbs the trajectory arc, levelling out */
  .slide.active .glideL{animation:glideL 2.2s var(--ease) .9s forwards;}
  @keyframes glideL{
    0%  {opacity:0; transform:translate(-102px,20px) rotate(-24deg) scale(.5);}
    16% {opacity:1; transform:translate(-102px,20px) rotate(-24deg) scale(1);}
    60% {transform:translate(-51px,-4px) rotate(-16deg);}
    100%{opacity:1; transform:translate(0,0) rotate(-6deg);}
  }
  /* IMPACT — glider arcs in from the left and dives into the bullseye */
  .slide.active .glideI{animation:glideI 1.5s var(--ease) .5s forwards;}
  @keyframes glideI{
    0%  {opacity:0; transform:translate(-78px,-50px) rotate(-58deg) scale(.6);}
    14% {opacity:1; transform:translate(-78px,-50px) rotate(-58deg) scale(1);}
    55% {transform:translate(-34px,-66px) rotate(-2deg);}
    100%{opacity:1; transform:translate(0,0) rotate(58deg) scale(.9);}
  }
  /* amber shock-ripple when the glider strikes the zone */
  .ripple{opacity:0; transform-box:fill-box; transform-origin:center;}
  .slide.active .ripple{animation:ripple 1.25s ease-out 1.9s infinite;}
  @keyframes ripple{
    0%  {opacity:.85; transform:scale(.35);}
    100%{opacity:0;   transform:scale(6);}
  }

  /* ---- navigation ------------------------------------------------------ */
  #nav{position:fixed; z-index:70; bottom:min(3.2vh,26px); left:50%;
    transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    background:rgba(8,17,32,.7); border:1px solid var(--grid); border-radius:40px;
    padding:8px 14px; backdrop-filter:blur(6px);}
  #nav button{background:none; border:none; color:var(--holo); cursor:pointer;
    font-size:18px; line-height:1; padding:4px 8px; border-radius:8px;
    font-family:var(--mono);}
  #nav button:hover{background:rgba(52,231,231,.14);}
  #dots{display:flex; gap:8px;}
  #dots .d{width:9px; height:9px; border-radius:50%; background:var(--grid);
    cursor:pointer; transition:all .3s;}
  #dots .d.on{background:var(--holo); box-shadow:var(--holoGlow); transform:scale(1.15);}
  #counter{font-family:var(--mono); font-size:12px; letter-spacing:.14em;
    color:var(--textDim); min-width:5.4ch; text-align:center;}
  /* sit the prev/next hints above the footer line so they never collide
     with the footer index/title or the centred nav bar at any width */
  .hint{position:fixed; z-index:70; bottom:min(7.5vh,60px);
    font-family:var(--mono); font-size:10px; letter-spacing:.14em;
    color:var(--textFaint); opacity:.8;}
  .hint.r{right:min(4vw,40px)} .hint.l{left:min(4vw,40px)}
  @media(max-width:820px){
    .grid4,.grid3{grid-template-columns:1fr 1fr;}
    .hero{grid-template-columns:1fr; gap:14px;}
    .hero .stagebox{max-height:42vh;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div id="stage"><div id="track"><!-- slides injected --></div></div>

<!-- ambient CRT overlay -->
<div id="fx"><div class="scan"></div><div class="sweep"></div><div class="flick"></div><div class="vig"></div></div>

<!-- navigation -->
<div class="hint l">◄ PREV</div>
<div class="hint r">NEXT ►</div>
<div id="nav">
  <button id="prev" title="Previous (←)">◄</button>
  <div id="dots"></div>
  <span id="counter">01 / 10</span>
  <button id="next" title="Next (→)">►</button>
</div>

<script>
/* ============================================================================
   CONTENT (mirrors scripts/theme.mjs)
   ========================================================================== */
const EVENT={program:"STEM ENGINEERING CHALLENGE SERIES",title:"OPERATION SKYLINE",
  subtitle:"The Rescue Glider Challenge",tagline:"Salvage. Engineer. Deploy. Save the zone.",
  date:"Saturday, 15 August 2026",venue:"Innovation Hangar, Main Auditorium",
  host:"presented by the Engineering Guild",edition:"FIELD BRIEFING // v1.0"};
const MISSION={code:"OP-SKYLINE // PRIORITY: CRITICAL",lines:[
  "Disaster strikes again.",
  "While approaching the rescue zone, teams hit dangerous terrain and severe conditions that halt all ground movement.",
  "The rescue point lies beyond a mountain ridge — and time is running out.",
  "Using only salvaged aircraft materials and available resources, each team must design and build an emergency glider capable of carrying critical supplies across the obstacle."],
  punch:"The mission now depends on your engineering creativity, precision, and teamwork."};
const OBJECTIVE={kicker:"EVENT OVERVIEW",title:"Your Objective, Rescue Engineers",
  lead:"Build a flight-worthy glider from salvage that clears the ridge and delivers its payload to the rescue zone.",
  cards:[
    {h:"Engineer the Airframe",p:"Design & assemble a glider from the salvaged materials on your bench."},
    {h:"Secure the Payload",p:"Carry the supply capsule — mass counts, but it must arrive intact."},
    {h:"Clear the Ridge",p:"Achieve the distance to cross the obstacle and reach the far side."},
    {h:"Hit the Zone",p:"Land on-target. Accuracy over the rescue point wins the mission."}]};
const SEQUENCE=[
  {id:"build",seq:"SEQUENCE 01 / 03",kicker:"ASSEMBLE THE GLIDER",title:"BUILD",
   line:"Salvage becomes airframe. Hands, blueprints, and precision under pressure.",
   note:"HOLOGRAPHIC ASSEMBLY — COMPONENTS LOCK INTO PLACE"},
  {id:"launch",seq:"SEQUENCE 02 / 03",kicker:"DEPLOY",title:"LAUNCH",
   line:"Wind up. Read the air. One clean release sends the payload skyward.",
   note:"THE GLIDER LEAVES THE HAND AND ENTERS THE FLIGHT ARC"},
  {id:"target",seq:"SEQUENCE 03 / 03",kicker:"TARGET: RESCUE ZONE",title:"IMPACT",
   line:"The arc holds true. Supplies strike the zone. Mission accomplished.",
   note:"CONTACT — THE RESCUE POINT LIGHTS UP ON IMPACT"}];
const RULES={kicker:"RULES & CONSTRAINTS",title:"Field Regulations",groups:[
  {h:"Salvage Only",items:["Balsa, paper, card, tape & string from the supply crate","No pre-built kits or powered components","One roll of tape per team — spend it wisely"]},
  {h:"Build Window",items:["45 minutes to design & construct","10-minute strategy huddle before the clock","Tools down when the siren sounds"]},
  {h:"Launch Rules",items:["Hand-launch only, from behind the deploy line","One practice throw, three scored attempts","Glider must be intact after each flight"]}]};
const JUDGING={kicker:"JUDGING CRITERIA",title:"How the Mission Is Scored",criteria:[
  {pct:35,h:"Distance",p:"Clearing the ridge — measured from the deploy line to touchdown."},
  {pct:30,h:"Target Accuracy",p:"Proximity of landing to the marked rescue zone."},
  {pct:20,h:"Design & Craft",p:"Structural creativity, aerodynamics, and build quality."},
  {pct:15,h:"Teamwork",p:"Coordination, safety, and clean execution under time."}]};
const TIMELINE={kicker:"MISSION TIMELINE",title:"Schedule of Operations",stops:[
  {t:"09:00",h:"Check-in & Briefing",p:"Teams assemble. Mission parameters issued."},
  {t:"09:30",h:"Salvage Distribution",p:"Supply crates handed out. Inspect your materials."},
  {t:"09:45",h:"Build Window Opens",p:"45 minutes on the clock. Engineer the airframe."},

// The emblem: rotating reticle + glider chevron (used on cover & closing)
function emblem(size){
  return `<svg viewBox="0 0 200 200" style="width:${size};height:${size};overflow:visible" aria-hidden="true">
    <defs>
      <filter id="eg" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g fill="none" stroke="var(--holo)" stroke-width="2" filter="url(#eg)">
      <circle cx="100" cy="100" r="86" stroke-opacity=".35"/>
      <circle class="spin" cx="100" cy="100" r="72" stroke-dasharray="10 16" style="transform-origin:100px 100px"/>
      <circle cx="100" cy="100" r="54" stroke-opacity=".55"/>
      <line x1="100" y1="6" x2="100" y2="30"/><line x1="100" y1="170" x2="100" y2="194"/>
      <line x1="6" y1="100" x2="30" y2="100"/><line x1="170" y1="100" x2="194" y2="100"/>
    </g>
    <g filter="url(#eg)">
      <path d="M60 118 L100 66 L140 118 L100 100 Z" fill="var(--holo)" fill-opacity=".16"
        stroke="var(--holoLt)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="100" cy="104" r="5" fill="var(--holoHot)"/>
    </g>
  </svg>`;
}

// Holo-figure (articulated neon mannequin) in a given pose.
// pose: 'build' | 'launch' | 'follow'.  Optional `xform` repositions/scales the
// whole figure within the 0..300 box (used on IMPACT to clear the target).
function figure(pose, xform=""){
  // joint coordinates in a 0..300 box
  const P={
    build:{ // both hands forward at bench, head down slightly
      head:[150,66], neck:[150,96], hip:[150,176],
      shL:[122,104], elL:[104,140], haL:[150,150],
      shR:[178,104], elR:[196,140], haR:[150,150],
      kneeL:[128,224], ftL:[120,286], kneeR:[176,224], ftR:[186,286]},
    launch:{ // right arm cocked back-up, torso leaning
      head:[150,60], neck:[150,92], hip:[152,172],
      shL:[124,100], elL:[100,132], haL:[92,168],
      shR:[178,100], elR:[210,74], haR:[196,42],
      kneeL:[128,222], ftL:[110,284], kneeR:[182,222], ftR:[200,284]},
    follow:{ // full extension forward after release
      head:[150,64], neck:[150,94], hip:[150,174],
      shL:[124,102], elL:[104,138], haL:[96,172],
      shR:[178,102], elR:[214,116], haR:[248,120],
      kneeL:[130,224], ftL:[118,286], kneeR:[178,224], ftR:[196,286]}
  }[pose];
  const bone=(a,b,w=9,delay=0)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"
    stroke="var(--holo)" stroke-width="${w}" stroke-linecap="round"
    class="draw" style="--len:220;animation-delay:${delay}s"/>`;
  const joint=(p,delay=0)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.4" fill="var(--holoHot)"
    class="popin" style="animation-delay:${delay}s"/>`;
  return `<svg viewBox="0 0 300 300" aria-hidden="true">
    <defs><filter id="fg-${pose}" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g filter="url(#fg-${pose})" fill="none"${xform ? ` transform="${xform}"` : ""}>
      <!-- spine + limbs -->
      ${bone(P.neck,P.hip,11,.05)}
      ${bone(P.neck,P.shL,8,.1)}${bone(P.shL,P.elL,8,.18)}${bone(P.elL,P.haL,7,.26)}
      ${bone(P.neck,P.shR,8,.1)}${bone(P.shR,P.elR,8,.18)}${bone(P.elR,P.haR,7,.26)}
      ${bone(P.hip,P.kneeL,9,.3)}${bone(P.kneeL,P.ftL,8,.38)}
      ${bone(P.hip,P.kneeR,9,.3)}${bone(P.kneeR,P.ftR,8,.38)}
      <!-- head -->
      <circle cx="${P.head[0]}" cy="${P.head[1]}" r="17" fill="var(--holo)" fill-opacity=".2"
        stroke="var(--holoLt)" stroke-width="3" class="draw" style="--len:120;animation-delay:0s"/>
      ${joint(P.neck,.5)}${joint(P.shL,.55)}${joint(P.elL,.6)}${joint(P.haL,.66)}
      ${joint(P.shR,.55)}${joint(P.elR,.6)}${joint(P.haR,.66)}
      ${joint(P.hip,.5)}${joint(P.kneeL,.7)}${joint(P.kneeR,.7)}
    </g>
  </svg>`;
}

const GLIDER_AR = 973 / 298; // sprite aspect ratio (w/h)
function gliderImg(cls, w, style = ""){
  const h = w / GLIDER_AR;
  return `<g class="${cls}"${style ? ` style="${style}"` : ""}>
    <g transform="scale(-1,1)">
      <image href="${GLIDER}" x="${(-w/2).toFixed(1)}" y="${(-h/2).toFixed(1)}"
        width="${w.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="xMidYMid meet"/>
    </g></g>`;
}

/* ============================================================================
   SLIDE TEMPLATES
   ========================================================================== */
function footer(i){
  return `<div class="footer">
    <span class="idx"><b>${String(i+1).padStart(2,"0")}</b> <span>/ 10 &nbsp; ${NAV[i]}</span></span>
    <span>${EVENT.title} // ${EVENT.subtitle}</span></div>`;
}

// 1 — COVER
function sCover(){return `
  <div class="corner l">${EVENT.host.toUpperCase()}</div>
  <div class="corner r">${EVENT.edition}</div>
  <div class="center">
    <div class="popin" style="animation-delay:.05s">${emblem("clamp(96px,13vw,168px)")}</div>
    <div class="kicker rise" style="animation-delay:.3s; margin-top:1.1em">${EVENT.program}</div>
    <h1 class="title rise" style="animation-delay:.42s">${EVENT.title}</h1>
    <div class="sub rise" style="animation-delay:.55s">${EVENT.subtitle}</div>
    <div class="tag rise" style="animation-delay:.68s">${EVENT.tagline}</div>
    <div class="meta rise" style="animation-delay:.82s"><b>${EVENT.date}</b> &nbsp;<i>·</i>&nbsp; ${EVENT.venue}</div>
  </div>`;}

// 2 — MISSION BRIEFING
function sBrief(i){
  const lns=MISSION.lines.map((l,k)=>`
    <div class="ln ${k===0?"first":""} rise" style="animation-delay:${.35+k*.14}s">
      <span class="bar"></span><p>${l}</p></div>`).join("");
  return `<div class="brief">
    <div class="kicker danger rise">${MISSION.code}</div>
    <h1 class="title rise" style="animation-delay:.12s">Disaster Strikes Again.</h1>
    <div class="rise" style="animation-delay:.24s"><span class="chip"><span class="dot"></span>MISSION BRIEFING</span></div>
    <div class="narr">${lns}</div>
    <div class="punch rise" style="animation-delay:${.35+MISSION.lines.length*.14+.1}s">${MISSION.punch}</div>
  </div>
  <svg style="position:absolute; right:-2%; top:12%; width:min(42vw,520px); height:min(42vw,520px); z-index:1; opacity:.5" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="var(--holo)" stroke-width="1.4" stroke-opacity=".6">
      ${[70,52,34,16].map(r=>`<circle cx="100" cy="100" r="${r}"/>`).join("")}
      <line x1="100" y1="14" x2="100" y2="186"/><line x1="14" y1="100" x2="186" y2="100"/>
    </g><circle cx="100" cy="100" r="7" fill="var(--danger)" opacity=".7"/>
  </svg>${footer(i)}`;
}

// 3 — OBJECTIVE
function sObjective(i){
  const cards=OBJECTIVE.cards.map((c,k)=>`
    <div class="card rise" style="animation-delay:${.2+k*.12}s">
      <div class="num">${String(k+1).padStart(2,"0")}</div>
      <h3>${c.h}</h3><p>${c.p}</p></div>`).join("");
  return `<div class="head">
      <div class="kicker rise">${OBJECTIVE.kicker}</div>
      <h1 class="title rise" style="animation-delay:.1s">${OBJECTIVE.title}</h1>
      <p class="lead rise" style="animation-delay:.2s">${OBJECTIVE.lead}</p>
    </div>
    <div class="grid4">${cards}</div>${footer(i)}`;
}

// HERO shell (build/launch/impact)
function heroShell(seq,stageSVG,i){
  return `<div class="hero">
    <div class="htext">
      <div class="seqmark rise">${seq.seq}</div>
      <div class="kicker rise" style="animation-delay:.1s; color:var(--textDim); text-shadow:none">${seq.kicker}</div>
      <div class="htitle rise" style="animation-delay:.18s">${seq.title}</div>
      <div class="hline rise" style="animation-delay:.3s">${seq.line}</div>
      <div class="hnote rise" style="animation-delay:.42s">${seq.note}</div>
    </div>
    <div class="stagebox">${stageSVG}</div>
  </div>${footer(i)}`;
}

// 4 — BUILD stage: figure + glider airframe drawing itself together (0..300 space)
function stageBuild(){
  return `${figure("build")}
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <defs><filter id="gb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <!-- workbench line -->
    <line x1="18" y1="250" x2="282" y2="250" stroke="var(--grid)" stroke-width="2"
      class="draw" style="--len:280"/>
    <!-- assembly reticle sweeping the airframe -->
    <rect x="98" y="112" width="104" height="58" rx="4" fill="none" stroke="var(--electron)"
      stroke-width="1.4" stroke-dasharray="6 8" class="fadein" style="animation-delay:1.8s; opacity:.5"/>
    <!-- glider airframe materialising in the hands (centre ~150,138) -->
    <g transform="translate(150,138)">${gliderImg("buildGlider", 118)}</g>
    <!-- payload capsule locking onto the nose -->
    <circle cx="206" cy="140" r="7" fill="var(--amber)" fill-opacity=".25"
      stroke="var(--amber)" stroke-width="2.2" filter="url(#gb)" class="popin" style="animation-delay:1.4s"/>
  </svg>`;
}

// 5 — LAUNCH stage: figure cocked, glider releasing up the arc (0..300 space)
function stageLaunch(){
  return `${figure("launch")}
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <marker id="ah" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
        <path d="M0 0 L9 4.5 L0 9 Z" fill="var(--holo)"/></marker></defs>
    <!-- deploy line -->
    <line x1="60" y1="258" x2="60" y2="210" stroke="var(--holo)" stroke-width="2.2"
      class="draw" style="--len:60"/>
    <text x="60" y="276" fill="var(--textFaint)" font-family="var(--mono)" font-size="11"
      text-anchor="middle" class="fadein" style="animation-delay:1s">DEPLOY LINE</text>
    <!-- launch trajectory arc (release -> skyward) -->
    <path id="arcL" d="M196 46 Q248 8 298 26" fill="none" stroke="var(--holo)"
      stroke-width="2.4" stroke-dasharray="2 9" marker-end="url(#ah)" filter="url(#gl)"
      class="draw" style="--len:220; animation-delay:.7s; opacity:.85"/>
    <!-- release burst near the throwing hand -->
    <circle cx="196" cy="46" r="9" fill="none" stroke="var(--holoLt)" stroke-width="2.5"
      filter="url(#gl)" class="popin" style="animation-delay:1s"/>
    <!-- the glider, released, flying up the arc (ends at arc tip 298,26) -->
    <g transform="translate(298,26)">${gliderImg("glideL", 90)}</g>
    <!-- wind ticks -->
    ${[96,126,156].map((y,k)=>`<line x1="24" y1="${y}" x2="46" y2="${y-6}" stroke="var(--electron)"
      stroke-width="1.6" stroke-opacity=".5" class="fadein" style="animation-delay:${1.2+k*.15}s"/>`).join("")}
  </svg>`;
}

// 6 — IMPACT stage: arc completes into target, rings light, amber ripple (0..300 space)
function stageImpact(){
  return `${figure("follow", "translate(-76,12) scale(0.9)")}
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <defs><filter id="gi" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="b"/><feMerge>
      <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="hit" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--amberLt)" stop-opacity=".9"/>
        <stop offset="60%" stop-color="var(--amber)" stop-opacity=".25"/>
        <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/></radialGradient></defs>
    <!-- flight arc: follow-through hand -> target (stays clear of the figure) -->
    <path d="M150 118 Q198 48 226 164" fill="none" stroke="var(--holo)" stroke-width="2.4"
      stroke-dasharray="2 9" filter="url(#gi)" class="draw" style="--len:180; opacity:.8"/>
    <!-- target: concentric rings, right side, lighting up in sequence -->
    <g filter="url(#gi)" transform="translate(228,168)">
      <circle r="60" fill="url(#hit)" class="fadein" style="animation-delay:1.15s"/>
      ${[56,42,28,15].map((r,k)=>`<circle r="${r}" fill="none"
        stroke="${k%2?"var(--amber)":"var(--holo)"}" stroke-width="2.6"
        class="popin" style="animation-delay:${.5+k*.14}s"/>`).join("")}
      <circle r="6" fill="var(--amberLt)" class="popin" style="animation-delay:1.05s"/>
      <!-- crosshairs -->
      <line x1="-70" y1="0" x2="-62" y2="0" stroke="var(--holo)" stroke-width="2"/>
      <line x1="62" y1="0" x2="70" y2="0" stroke="var(--holo)" stroke-width="2"/>
      <line x1="0" y1="-70" x2="0" y2="-62" stroke="var(--holo)" stroke-width="2"/>
      <line x1="0" y1="62" x2="0" y2="70" stroke="var(--holo)" stroke-width="2"/>
      <!-- shock ripple on contact -->
      <circle class="ripple" r="10" fill="none" stroke="var(--amberLt)" stroke-width="3"/>
    </g>
    <!-- glider (amber) flying along the arc into the bullseye (ends at 228,168) -->
    <g transform="translate(228,168)">${gliderImg("glideI", 72)}</g>
    <text x="196" y="250" fill="var(--amber)" font-family="var(--mono)" font-size="11"
      font-weight="700" text-anchor="middle" letter-spacing="1.4" class="fadein"
      style="animation-delay:1.55s">RESCUE ZONE ● SECURED</text>
  </svg>`;
}

// 7 — RULES
function sRules(i){
  const cols=RULES.groups.map((g,k)=>`
    <div class="col card rise" style="animation-delay:${.18+k*.14}s">
      <div class="cnum">0${k+1}</div><h3>${g.h}</h3>
      <ul>${g.items.map(it=>`<li>${it}</li>`).join("")}</ul></div>`).join("");
  return `<div class="head">
      <div class="kicker rise">${RULES.kicker}</div>
      <h1 class="title rise" style="animation-delay:.1s">${RULES.title}</h1></div>
    <div class="grid3">${cols}</div>${footer(i)}`;
}

// 8 — JUDGING
function sJudging(i){
  const rows=JUDGING.criteria.map((c,k)=>`
    <div class="jrow rise" style="animation-delay:${.2+k*.12}s">
      <span class="pct">${c.pct}%</span>
      <div class="info">
        <div class="rowtop"><h3>${c.h}</h3></div>
        <div class="bar"><i style="--w:${c.pct}%; transition-delay:${.3+k*.12}s"></i></div>
        <p>${c.p}</p>
      </div></div>`).join("");
  return `<div class="head">
      <div class="kicker rise">${JUDGING.kicker}</div>
      <h1 class="title rise" style="animation-delay:.1s">${JUDGING.title}</h1></div>
    <div class="judge">${rows}</div>${footer(i)}`;
}

// 9 — TIMELINE
function sTimeline(i){
  const stops=TIMELINE.stops.map((s,k)=>`
    <div class="stop rise" style="animation-delay:${.2+k*.1}s">
      <span class="t">${s.t}</span><span class="node"></span>
      <span class="txt"><b>${s.h}</b><span>${s.p}</span></span></div>`).join("");
  return `<div class="head">
      <div class="kicker rise">${TIMELINE.kicker}</div>
      <h1 class="title rise" style="animation-delay:.1s">${TIMELINE.title}</h1></div>
    <div class="tl"><div class="spine"><i></i></div>${stops}</div>${footer(i)}`;
}

// 10 — CLOSING
function sClosing(){return `
  <div class="center">
    <div class="popin" style="animation-delay:.05s">${emblem("clamp(84px,11vw,150px)")}</div>
    <div class="kicker rise" style="animation-delay:.3s; margin-top:1em; letter-spacing:.5em">${CLOSING.kicker}</div>
    <h1 class="title rise" style="animation-delay:.42s; font-size:clamp(38px,6.2vw,80px)">${CLOSING.title}</h1>
    <div class="tag rise" style="animation-delay:.55s">${CLOSING.line}</div>
    <div class="sub rise" style="animation-delay:.68s; letter-spacing:.16em; margin-top:.5em">${CLOSING.cta}</div>
    <div class="meta rise" style="animation-delay:.82s">${CLOSING.sign}</div>
  </div>`;}

/* ============================================================================
   ASSEMBLE + NAVIGATE
   ========================================================================== */
const slides=[
  sCover(), sBrief(1), sObjective(2),
  heroShell(SEQUENCE[0],stageBuild(),3),
  heroShell(SEQUENCE[1],stageLaunch(),4),
  heroShell(SEQUENCE[2],stageImpact(),5),
  sRules(6), sJudging(7), sTimeline(8), sClosing()
];
const track=document.getElementById("track");
track.innerHTML=slides.map((html,i)=>`<section class="slide" data-i="${i}">${html}</section>`).join("");
const secs=[...document.querySelectorAll(".slide")];

const dots=document.getElementById("dots");
dots.innerHTML=secs.map((_,i)=>`<span class="d" data-i="${i}" title="${NAV[i]}"></span>`).join("");
const dotEls=[...dots.children];
const counter=document.getElementById("counter");

let cur=0;
function go(n){
  cur=Math.max(0,Math.min(secs.length-1,n));
  track.style.transform=`translateX(${-cur*100}%)`;
  secs.forEach((s,i)=>s.classList.toggle("active",i===cur));
  dotEls.forEach((d,i)=>d.classList.toggle("on",i===cur));
  counter.textContent=`${String(cur+1).padStart(2,"0")} / ${String(secs.length).padStart(2,"0")}`;
}
const next=()=>go(cur+1), prev=()=>go(cur-1);

document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
dotEls.forEach(d=>d.onclick=()=>go(+d.dataset.i));
window.addEventListener("keydown",e=>{
  if(["ArrowRight","ArrowDown"," ","PageDown","Enter"].includes(e.key)){e.preventDefault();next();}
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==="Home")go(0); else if(e.key==="End")go(secs.length-1);
});
// click halves of the stage to page (ignore clicks on the nav bar)
document.getElementById("stage").addEventListener("click",e=>{
  if(e.target.closest("#nav"))return;
  (e.clientX > window.innerWidth/2) ? next() : prev();
});
// touch swipe
let tx=null;
addEventListener("touchstart",e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener("touchend",e=>{
  if(tx===null)return; const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){ dx<0?next():prev(); } tx=null;});

go(0);
</script>
</body>
